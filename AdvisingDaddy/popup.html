<!DOCTYPE html>
<html>

<head>
    <title>Advising Manager</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body class="dark">
    <div class="container">
        <div class="popup-header">
            <div class="header-left">
                <button id="checkUpdateBtn" class="icon-btn update-check-btn" title="Check for updates" aria-label="Check for updates">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </button>
                <span id="localVersionBadge" class="header-label"></span>
            </div>
            <h2 class="popup-title">Operation Controller</h2>
            <div class="header-right">
                <button id="viewMetaBtn" class="icon-btn" title="Open Planner" aria-label="Open Planner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M14 3h7v7" />
                        <path d="M10 14L21 3" />
                        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
                    </svg>
                </button>
                <span class="header-label">Planner</span>
            </div>
        </div>
        <div id="updatePanel" class="update-panel update-panel--hidden">
            <div style="display: flex; align-items: center; gap: 8px; flex: 1; justify-content: space-between;">
                <span id="updatePanelText">Checking...</span>
                <a id="updatePanelLink" href="#" target="_blank" rel="noopener noreferrer" class="update-panel-link" style="display:none;"></a>
            </div>
            <button id="closeUpdatePanelBtn" class="close-panel-btn" title="Close" aria-label="Close">&times;</button>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="injectMetaToggle">
                <span class="slider"></span>
            </label>
            <strong id="injectMetaText">Inject Metadata Disabled <span class="domain-tag">[all]</span></strong>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="seatAlertToggle">
                <span class="slider"></span>
            </label>
            <strong id="seatAlertText">Seat Alert Disabled <span class="domain-tag">[queued]</span></strong>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="autoSaveToggle">
                <span class="slider"></span>
            </label>
            <strong id="autoSaveText">Auto Save Disabled <span class="domain-tag">[queued]</span></strong>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="alertStatusToggle">
                <span class="slider"></span>
            </label>
            <strong id="alertStatusText">New Section Alert Disabled <span class="domain-tag">[queued]</span></strong>
        </div>
        <!-- Removed duplicate viewMetaBtn -->
        <hr>
        <div class="input-group">
            <input type="text" id="courseInput" placeholder="Course (e.g., BIO103)">
            <input type="text" id="sectionInput" placeholder="Sections (e.g., 1,2,3)">
            <button id="addBtn">Add Course to the Queue</button>
        </div>

        <hr>

        <h3 class="queue-title">Course Queue</h3>
        <div id="priorityList">
            <div class="empty-state">None</div>
        </div>

        <button id="clearStorage" class="danger-btn">Clear Whole Queue</button>
    </div>
    <footer class="popup-footer">
        &copy;Jobayer
    </footer>
    <script src="popup.js"></script>
</body>

</html>
