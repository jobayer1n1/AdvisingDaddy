<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Advising Manager</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body class="dark">
    <div class="container">
        <div class="popup-header">
            <div class="header-left">
                <button id="checkUpdateBtn" class="icon-btn update-check-btn" title="Check for updates"
                    aria-label="Check for updates">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                </button>
                <span id="localVersionBadge" class="header-label"></span>
            </div>
            <h2 class="popup-title">Operation Controller</h2>
            <div class="header-right">
                <button id="viewMetaBtn" class="icon-btn" title="Open Planner" aria-label="Open Planner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M14 3h7v7" />
                        <path d="M10 14L21 3" />
                        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
                    </svg>
                </button>
                <span class="header-label">Planner</span>
            </div>
        </div>
        <div id="updatePanel" class="update-panel update-panel--hidden">
            <div style="display: flex; align-items: center; gap: 8px; flex: 1; justify-content: space-between;">
                <span id="updatePanelText">Checking...</span>
                <a id="updatePanelLink" href="#" target="_blank" rel="noopener noreferrer" class="update-panel-link"
                    style="display:none;"></a>
            </div>
            <button id="closeUpdatePanelBtn" class="close-panel-btn" title="Close" aria-label="Close">&times;</button>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="injectMetaToggle">
                <span class="slider"></span>
            </label>
            <strong id="injectMetaText">Inject Metadata Disabled <span class="domain-tag">[all]</span></strong>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="seatAlertToggle">
                <span class="slider"></span>
            </label>
            <strong id="seatAlertText">Seat Alert Disabled <span class="domain-tag">[queued]</span></strong>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="autoSaveToggle">
                <span class="slider"></span>
            </label>
            <strong id="autoSaveText">Auto Save Disabled <span class="domain-tag">[queued]</span></strong>
        </div>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="alertStatusToggle">
                <span class="slider"></span>
            </label>
            <strong id="alertStatusText">New Section Alert Disabled <span class="domain-tag">[queued]</span></strong>
        </div>
        <hr>
        <div class="input-group">
            <input type="text" id="courseInput" placeholder="Course (e.g., BIO103)">
            <input type="text" id="sectionInput" placeholder="Sections (e.g., 1,2,3)">
            <button id="addBtn">Add Course to the Queue</button>
        </div>

        <hr>

        <h3 class="queue-title">Course Queue</h3>
        <div id="priorityList">
            <div class="empty-state">None</div>
        </div>

        <button id="clearStorage" class="danger-btn">Clear Whole Queue</button>
    </div>
<footer class="popup-footer">
    <button id="githubBtn" class="github-btn" title="Open GitHub repository"
        aria-label="Open GitHub repository">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
            fill="currentColor" aria-hidden="true">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
    </button>
</footer>
    <script src="popup.js"></script>
</body>

</html>
