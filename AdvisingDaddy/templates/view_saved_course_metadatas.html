<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Course Metadata</title>
    <style>
        :root {
            --accent: #91C6BC;
            --accent-soft: rgba(145, 198, 188, 0.18);
            --bg: #0f0f10;
            --bg-soft: #17181a;
            --bg-card: #1c1e22;
            --border: #2b3138;
            --text: #f1f4f8;
            --text-muted: #9aa3ad;
            --red: #ff6161;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 32px 24px;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        header svg { color: var(--accent); flex-shrink: 0; }

        h1 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
        }

        .meta-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .meta-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .meta-chip span {
            color: var(--text);
            font-weight: 600;
            margin-left: 4px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        #searchInput {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
            padding: 7px 12px;
            width: 280px;
            outline: none;
            transition: border-color 0.2s;
        }

        #searchInput:focus { border-color: var(--accent); }
        #searchInput::placeholder { color: var(--text-muted); }

        #resultCount {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.87rem;
        }

        thead th {
            background: var(--bg-card);
            color: var(--accent);
            font-weight: 600;
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--accent-soft); }

        td {
            padding: 8px 14px;
            color: var(--text);
            vertical-align: middle;
        }

        td.muted { color: var(--text-muted); }

        .badge {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 4px;
            padding: 1px 7px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        #noResults {
            display: none;
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }

        .delete-btn {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 7px;
            background: transparent;
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .delete-btn:hover {
            background: rgba(255, 97, 97, 0.1);
            box-shadow: 0 0 10px rgba(255, 97, 97, 0.4);
        }
    </style>
</head>
<body>

<header>
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>
    <h1>Saved Course Metadata</h1>
    <button id="deleteMetaBtn" class="delete-btn" title="Delete all saved metadata">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        Delete data
    </button>
</header>

<div id="app">
    <p class="no-data">Loading…</p>
</div>

<script src="view_saved_course_metadatas.js"></script>
</body>
</html>
