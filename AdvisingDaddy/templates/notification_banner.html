<!-- AdvisingDaddy Gamified Floating HUD Notification Banner & Toast Template -->
<style id="advdaddy-notification-styles">
.advdaddy-toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2147483647; /* Ensure it stays above university portal elements */
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
    max-width: 390px;
    width: calc(100vw - 40px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}

.advdaddy-toast {
    pointer-events: auto;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #141922;
    color: #f1f4f8;
    border: 1px solid #283344;
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.2);
    overflow: hidden;
    transform: translateX(120%);
    opacity: 0;
}

/* Snappy spring slide-in entry animation */
@keyframes advdaddySlideIn {
    0% {
        transform: translateX(115%);
        opacity: 0;
    }
    75% {
        transform: translateX(-4px);
        opacity: 1;
    }
    100% {
        transform: translateX(0);
        opacity: 1;
    }
}

.advdaddy-toast.show {
    animation: advdaddySlideIn 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.advdaddy-toast.hide {
    transform: translateX(120%);
    opacity: 0;
    transition: transform 0.28s ease, opacity 0.28s ease;
}

/* Gamified HUD Top Bar */
.advdaddy-toast-hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 6px 14px;
    background: rgba(0, 0, 0, 0.25);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

.advdaddy-toast-badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--toast-accent, #91C6BC);
}

.advdaddy-toast-close {
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 2px 6px;
    font-size: 13px;
    line-height: 1;
    border-radius: 4px;
    transition: color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
}

.advdaddy-toast-close:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.12);
    transform: scale(1.1);
}

/* Content Area */
.advdaddy-toast-content {
    display: flex;
    align-items: flex-start;
    padding: 12px 14px 14px 14px;
    gap: 12px;
}

.advdaddy-toast-icon {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    color: var(--toast-accent, #91C6BC);
    margin-top: 1px;
}

.advdaddy-toast-icon svg {
    width: 100%;
    height: 100%;
}

.advdaddy-toast-body {
    flex: 1;
    min-width: 0;
}

.advdaddy-toast-title {
    font-weight: 700;
    font-size: 14px;
    line-height: 1.3;
    color: #ffffff;
    letter-spacing: 0.2px;
    margin-bottom: 4px;
}

.advdaddy-toast-message {
    font-size: 13px;
    line-height: 1.45;
    color: #cbd5e1;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

/* Time Left Bar */
.advdaddy-toast-track {
    position: relative;
    height: 4px;
    background: rgba(255, 255, 255, 0.16);
    width: 100%;
    overflow: hidden;
    box-sizing: border-box;
}

.advdaddy-toast-progress {
    display: block;
    height: 100%;
    width: 100%;
    background-color: var(--toast-accent, #91C6BC);
    transform-origin: left;
}

@keyframes advdaddyDrain {
    0% {
        width: 100%;
    }
    100% {
        width: 0%;
    }
}

/* Variant Accents */
.advdaddy-toast--info {
    --toast-accent: #91C6BC;
}

.advdaddy-toast--success {
    --toast-accent: #10b981;
}

.advdaddy-toast--warning {
    --toast-accent: #f59e0b;
}

.advdaddy-toast--danger {
    --toast-accent: #ef4444;
}
</style>

<div class="advdaddy-toast-container" id="advdaddyToastContainer"></div>

<template id="advdaddyToastTemplate">
    <div class="advdaddy-toast" role="alert">
        <div class="advdaddy-toast-hud">
            <div class="advdaddy-toast-badge">
                <span class="advdaddy-toast-badge-text">SYSTEM ALERT</span>
            </div>
            <button type="button" class="advdaddy-toast-close" title="Dismiss notification" aria-label="Dismiss notification">✕</button>
        </div>
        <div class="advdaddy-toast-content">
            <div class="advdaddy-toast-icon"></div>
            <div class="advdaddy-toast-body">
                <div class="advdaddy-toast-title"></div>
                <div class="advdaddy-toast-message"></div>
            </div>
        </div>
        <div class="advdaddy-toast-track" title="Time remaining">
            <div class="advdaddy-toast-progress"></div>
        </div>
    </div>
</template>
