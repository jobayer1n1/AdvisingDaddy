<!DOCTYPE html>
<html>

<head>
    <title>Advising Manager</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body class="dark">
    <div class="container">
        <h2>Advising Manager</h2>
        <div class="master-control">
            <label class="switch">
                <input type="checkbox" id="masterToggle">
                <span class="slider"></span>
            </label>
            <strong id="statusLabel">Automation Disabled</strong>
        </div>
        <!-- <div class="master-control">
            <span>Dark Mode</span>
            <label class="switch">
                <input type="checkbox" id="darkToggle">
                <span class="slider"></span>
            </label>
        </div> -->
        <hr>
        <div class="input-group">
            <input type="text" id="courseInput" placeholder="Course (e.g., BIO103)">
            <input type="text" id="sectionInput" placeholder="Sections (e.g., 1,2,3)">
            <button id="addBtn" style="color: #91C6BC;">Add Course</button>
        </div>

        <hr>

        <h3>Course Queue</h3>
        <div id="priorityList">
            <div class="empty-state">None</div>
        </div>

        <button id="clearStorage" class="danger-btn" >Clear Whole Queue</button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
